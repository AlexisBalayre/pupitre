# Path-based area labels, applied by .github/workflows/labeler.yml.
# `documentation`, `dependencies` and `github_actions` are not here: the first follows the
# title prefix, the other two are Dependabot's.
area/cli:
  - changed-files:
      - any-glob-to-any-file: src/cli/**

area/core:
  - changed-files:
      - any-glob-to-any-file: src/core/**

area/claude:
  - changed-files:
      - any-glob-to-any-file: src/claude/**

area/adapters:
  - changed-files:
      - any-glob-to-any-file: src/adapters/**

area/docs:
  - changed-files:
      - any-glob-to-any-file: docs/**

area/tooling:
  - changed-files:
      - any-glob-to-any-file:
          - .claude/**
          - .github/**
          - scripts/**
