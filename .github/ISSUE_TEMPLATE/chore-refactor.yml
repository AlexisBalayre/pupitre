name: Chore or refactor
description: A change that leaves behavior as it is. No design unless a trigger of decision 176 fires.
title: "chore: "
labels: [chore-refactor]
body:
  - type: markdown
    attributes:
      value: |
        Every field but Estimate and Dependency is required. The rubric says what a filled field looks like and what makes one
        vague: [docs/tickets/chore-refactor.md](https://github.com/AlexisBalayre/pupitre/blob/main/docs/tickets/chore-refactor.md). The operator or a
        collaborator with write access applies `ready`; intake then checks the fields and removes the label if any is missing or vague.
        A one-word answer or a placeholder ("TBD", "n/a", "-") counts as vague.
  - type: dropdown
    id: kind
    attributes:
      label: Kind
      options:
        - chore
        - refactor
    validations:
      required: true
  - type: textarea
    id: scope_boundary
    attributes:
      label: Scope boundary
      description: Where the change stops, and the neighbour left as it is even if it is tempting to touch. Not "everything" or "core".
      placeholder: Split plan.service.ts in two; callers and exported names stay as they are.
    validations:
      required: true
  - type: textarea
    id: behavior_unchanged_proof
    attributes:
      label: Proof that behavior is unchanged
      description: >-
        Checks that exist today and pass before and after without edits: test files, commands or outputs.
        Good: "test/unit/core/plan-service.test.ts passes without edits, and `pup status --json` is byte-identical on the fixture."
        Vague: "No regressions; I tested it."
    validations:
      required: true
  - type: textarea
    id: files_in_scope
    attributes:
      label: Files in scope
      description: One path or glob per line; nothing outside them may change. Name files, not a whole tree such as `src/**`.
      placeholder: |
        src/core/plan.service.ts
        test/unit/core/plan-service.test.ts
    validations:
      required: true
  - type: input
    id: estimate
    attributes:
      label: Estimate
      description: Optional. The source lines you expect to change, as a number. Over 600 forces a design (decision 173).
      placeholder: 200 lines
  - type: checkboxes
    id: dependency
    attributes:
      label: Dependency
      options:
        - label: Adds a dependency (forces a design)
