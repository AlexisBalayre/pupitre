# Labels every PR: `area/*` from the files it changes (.github/labeler.yml) and one type label
# from the conventional-commit prefix of its title. Both steps only touch labels they manage,
# so labels a person adds by hand stay.
#
# pull_request_target so fork PRs get labels too. It is safe because nothing here checks out or
# runs the PR's code: the labeler reads its config from the base branch, and the title only
# goes through `context.payload`, never into a shell or the script text.
name: Label PRs

on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - name: Area labels from changed files
        uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          sync-labels: true

      - name: Type label from the title prefix
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const TYPES = {
              feat: "enhancement",
              fix: "bug",
              docs: "documentation",
              refactor: "refactor",
              test: "test",
              chore: "chore",
              perf: "perf",
            };
            const pr = context.payload.pull_request;
            const prefix = /^(\w+)(\([^)]*\))?!?:/.exec(pr.title)?.[1];
            const want = Object.hasOwn(TYPES, prefix) ? TYPES[prefix] : undefined;
            const have = pr.labels.map((l) => l.name);
            const issue_number = pr.number;
            const { owner, repo } = context.repo;

            // No recognised prefix says nothing about the type, so hand-added labels stay.
            for (const name of want ? Object.values(TYPES) : []) {
              if (name !== want && have.includes(name)) {
                await github.rest.issues.removeLabel({ owner, repo, issue_number, name });
              }
            }
            if (want && !have.includes(want)) {
              await github.rest.issues.addLabels({ owner, repo, issue_number, labels: [want] });
            }
