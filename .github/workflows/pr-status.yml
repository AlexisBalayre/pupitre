# Keeps one status label on every open PR, so the list shows at a glance which are ready
# to merge. First match wins:
#   draft > conflicts > changes-requested > review-open > ci-failing >
#   ci-pending > ready
#
# An operator who declines the CI review's importants that have no thread to resolve adds the
# `review-accepted` label. It holds for the summary review it was added after, and this workflow
# removes it once a later round posts (decision 165).
#
# Recomputed when the PR is opened, reopened, pushed to, retargeted, marked ready or draft or
# closed, on a review, when `review-accepted` is added or removed, and when a Claude Code Review
# run for it ends. Two events recompute every
# open PR: a push to main (it can introduce conflicts anywhere) and the owner's `@claude review`
# retry, which runs on main and links no PR. No event an outsider can start does. A closed PR
# loses its label.
# The name under `workflow_run` must match that workflow's `name:`.
#
# pull_request_target and workflow_run run with write access, so nothing here checks out or runs
# PR code: it only reads PR metadata through the API. Nor does it run any file outside this one:
# the token is in its environment (decision 165).
name: PR status

on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited, ready_for_review, converted_to_draft, closed, labeled, unlabeled]
  pull_request_review:
    types: [submitted, dismissed]
  workflow_run:
    workflows: ["Claude Code Review"]
    types: [completed]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  checks: read
  statuses: read

jobs:
  pr-status:
    # Per PR, so one PR's event cannot cancel another's pending recompute; the events that
    # recompute them all share the `main` group. The group is on the job so a skipped run never
    # joins.
    concurrency:
      group: pr-status-${{ github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number || 'main' }}
    # A fork's review event gets a read-only token and cannot label; its PR is still relabelled by
    # pull_request_target and by pushes to main. A workflow_run counts only when it is a real
    # review of this repo's own PR: a fork can name a workflow "Claude Code Review" too, and every
    # issue comment starts a run that skips. A run on main that links no PR counts only when the
    # owner started it: only the owner's comment makes that workflow's review job run, so no
    # outsider can start a recompute-all. A title or body edit cannot change the label; a new base
    # branch can (conflicts). Of the label events only `review-accepted` can; only someone with
    # triage access can label, and the labels this job sets start no workflow.
    if: >-
      (github.event_name != 'pull_request_target' || github.event.action != 'edited' || github.event.changes.base)
      && ((github.event.action != 'labeled' && github.event.action != 'unlabeled') || github.event.label.name == 'review-accepted')
      && (github.event_name != 'pull_request_review' || github.event.pull_request.head.repo.full_name == github.repository)
      && (github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion != 'skipped'
          && github.event.workflow_run.head_repository.full_name == github.repository
          && (github.event.workflow_run.pull_requests[0].number != null
              || (github.event.workflow_run.event == 'issue_comment'
                  && github.event.workflow_run.triggering_actor.login == github.repository_owner))))
    runs-on: ubuntu-latest
    steps:
      - name: Set the status label
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const LABELS = {
              "draft": ["ededed", "Still a draft"],
              "conflicts": ["b60205", "Cannot merge: conflicts with the base branch"],
              "changes-requested": ["d93f0b", "A reviewer asked for changes"],
              "review-open": ["e99695", "The CI review has important findings to address"],
              "ci-failing": ["d73a4a", "A check failed"],
              "ci-pending": ["fbca04", "Checks are still running"],
              "ready": ["0e8a16", "Ready to merge"],
            };
            // Not a status: the operator sets it and the loop over LABELS never touches it.
            const ACCEPTED = "review-accepted";
            const { owner, repo } = context.repo;

            const numbers = await (async () => {
              if (context.payload.pull_request) return [context.payload.pull_request.number];
              if (context.payload.workflow_run) {
                // Empty for the owner's `@claude review` retry, which runs on main.
                const linked = context.payload.workflow_run.pull_requests.map((p) => p.number);
                if (linked.length) return linked;
              }
              const open = await github.paginate(github.rest.pulls.list, { owner, repo, state: "open" });
              return open.map((p) => p.number);
            })();

            const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

            // `REVIEW_HEADING` and the count lines of `bodyLines` (tools/review/src/review-body.utils.ts).
            // tools/review/test/unit/pr-status-workflow.test.ts runs this copy on bodies that
            // renderer writes, so a reworded line fails a test, not a label.
            const REVIEW_HEADING = "## Claude code review";

            // A round with no verdict (`noVerdictReason`) opens its body with this line and lists no
            // finding, so it says nothing about the importants still owed. Matched on the line that
            // opens the body under the heading, whatever blank lines precede it, and on no other,
            // so a finding's text quoting it cannot hide a verdict.
            function isVerdict(body) {
              const opening = body.split(/\r?\n/).slice(1).find((line) => line.trim() !== "") ?? "";
              return !/^\*\*.+\.\*\* Nothing in this round is a verdict on the diff\.$/.test(opening);
            }

            // The importants a summary review lists with no inline thread to resolve: the round's
            // findings with no line in the diff to anchor to, and the prior round's still open.
            // A carried one may have been anchored in its own round: `threaded` holds the important
            // each bot thread names in its marker, resolved or not, and a carried entry whose file,
            // whole line range and description match one is left to that thread, one entry per
            // thread, so the resolved thread of an earlier finding at the same lines releases no
            // other. A carried entry is the model's copy of the prior record, so its description is
            // compared on its letters and digits only: a dropped period, a collapsed space or a
            // re-escaped quote still matches; a rewording does not, and `review-accepted` covers it.
            // Finding text can hold column-0 lines shaped like a count header or a bullet, so each
            // carried section is counted on its own: its header adds N, and only the N lines under
            // it (after the blank line `carriedLines` writes) may release any, each at most one,
            // when all N are list lines and a blank line or the end of the body follows them;
            // otherwise the section releases nothing. A forged section therefore never counts
            // below zero, and no list line outside a section's own N can lower its count.
            function unthreadedImportants(body, threaded) {
              const key = (file, line, description) =>
                JSON.stringify([file, line, description.toLowerCase().replace(/[^\p{L}\p{N}]+/gu, "")]);
              const lines = body.split(/\r?\n/);
              const unclaimed = threaded.map((held) => key(...JSON.parse(held)));
              let sum = 0;
              lines.forEach((line, i) => {
                const unanchored = /^(\d+) important findings? with no line in this diff to anchor to:$/.exec(line);
                if (unanchored) sum += Number(unanchored[1]);
                const carried = /^(\d+) important findings? from .+ still open \(not raised again\):$/.exec(line);
                if (!carried) return;
                const owed = Number(carried[1]);
                const first = lines[i + 1] === "" ? i + 2 : i + 1;
                const bullets = lines.slice(first, first + owed);
                const closed =
                  bullets.length === owed &&
                  bullets.every((bullet) => bullet.startsWith("- ")) &&
                  (lines[first + owed] ?? "") === "";
                let open = owed;
                for (const bullet of closed ? bullets : []) {
                  const entry = /^- `([^`]+):([^`:]+)` \([^)]*\): (.*)$/.exec(bullet);
                  const holder = entry ? unclaimed.indexOf(key(entry[1], entry[2], entry[3])) : -1;
                  if (holder !== -1) {
                    unclaimed.splice(holder, 1);
                    open--;
                  }
                }
                sum += open;
              });
              return sum;
            }

            // Whether the operator's `name` label, read from the PR's issue events in the order
            // GitHub lists them, is on and was added after `since` (the newest summary review's
            // time, in ms). Added in the same second as that review, it may predate it, so it
            // does not hold.
            function acceptedSince(events, name, since) {
              const last = events
                .filter((e) => (e.event === "labeled" || e.event === "unlabeled") && e.label?.name === name)
                .at(-1);
              return last?.event === "labeled" && Date.parse(last.created_at) > since;
            }

            // Every bot-opened review thread, as `ci-wait.service.ts` reads them. `important` is the
            // `[file, line, description]` its comment's last line names (`importantMarker`), as
            // JSON, or null: a comment posted before the marker existed, or whose marker names
            // another file than the thread's, holds none. Only the last line counts, since the
            // finding's own text comes before it. `review` is the node id of the review that opened
            // it, which is the REST review's `node_id`: its `databaseId` is a 32-bit Int, and
            // review ids have outgrown that.
            async function botThreads(number) {
              const found = [];
              let after = null;
              do {
                const { repository } = await github.graphql(
                  `query($owner: String!, $repo: String!, $number: Int!, $after: String) {
                    repository(owner: $owner, name: $repo) {
                      pullRequest(number: $number) {
                        reviewThreads(first: 100, after: $after) {
                          pageInfo { hasNextPage endCursor }
                          nodes {
                            isResolved path
                            comments(first: 1) { nodes { author { login } body pullRequestReview { id } } }
                          }
                        }
                      }
                    }
                  }`,
                  { owner, repo, number, after },
                );
                const threads = repository.pullRequest.reviewThreads;
                for (const t of threads.nodes) {
                  const first = t.comments.nodes[0];
                  if (first?.author?.login !== "github-actions") continue;
                  const last = (first.body ?? "").trimEnd().split(/\r?\n/).at(-1);
                  const marker = /^<!-- important (\[.*\]) -->$/.exec(last);
                  let held = null;
                  try {
                    held = marker && JSON.parse(marker[1]);
                  } catch {}
                  const named =
                    Array.isArray(held) &&
                    held.length === 3 &&
                    held.every((v) => typeof v === "string") &&
                    held[0] === t.path;
                  found.push({
                    isResolved: t.isResolved,
                    important: named ? JSON.stringify(held) : null,
                    review: first.pullRequestReview?.id,
                  });
                }
                after = threads.pageInfo.hasNextPage ? threads.pageInfo.endCursor : null;
              } while (after);
              return found;
            }

            async function statusOf(number) {
              // `mergeable` is computed lazily: null until GitHub has worked it out.
              let pr;
              for (let i = 0; i < 5; i++) {
                ({ data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: number }));
                if (pr.mergeable !== null || pr.state !== "open" || pr.draft) break;
                await sleep(3000);
              }
              if (pr.state !== "open") return undefined;
              if (pr.draft) return "draft";
              if (pr.mergeable_state === "dirty") return "conflicts";

              const reviews = await github.paginate(github.rest.pulls.listReviews, {
                owner, repo, pull_number: number,
              });
              const latest = new Map();
              for (const r of reviews) {
                if (r.state === "COMMENTED" || !r.user) continue;
                // Anyone can submit a review on a public repo; only repo insiders count.
                if (!["OWNER", "MEMBER", "COLLABORATOR"].includes(r.author_association)) continue;
                latest.set(r.user.login, r.state);
              }
              if ([...latest.values()].includes("CHANGES_REQUESTED")) return "changes-requested";

              // The review poster reports a commit status, which an `@claude review` retry on main
              // updates while the failed check run on the head stays: for a context that has a
              // status, the status decides. This job's own check run says nothing about the PR; it
              // is named after the job id unless the job has a `name:`, so giving this job a
              // `name:` means changing this filter.
              const { data: combined } = await github.rest.repos.getCombinedStatusForRef({
                owner, repo, ref: pr.head.sha, per_page: 100,
              });
              // The poster sets `success` on every run it posted, findings or not (decision 90).
              const review = combined.statuses.find((s) => s.context === "claude-review");
              // An unresolved bot thread is an important the review raised and nobody closed: it
              // outlives the pushes that clear the status description (an incremental round never
              // re-raises a prior important). The description covers the round just posted. An
              // important with no line to anchor to gets no thread, nor does the incremental round
              // open one for an important it carries: the newest summary review with a verdict
              // lists both until a round finds them fixed, and it too outlives a push. A carried
              // important that has a thread from its own round is that thread's to hold. A review
              // that raised importants, by a count line or by opening a bot thread, and has no
              // summary review with a verdict at or after it leaves the count unknown: that holds
              // the PR in review rather than reading zero.
              const threads = await botThreads(number);
              const opened = new Set(threads.map((t) => t.review));
              const isSummary = (r) => r.user?.login === "github-actions[bot]" && r.body?.startsWith(REVIEW_HEADING);
              const verdictAt = reviews.findLastIndex((r) => isSummary(r) && isVerdict(r.body));
              const raisedAt = reviews.findLastIndex(
                (r) => opened.has(r.node_id) ||(isSummary(r) && /^\d+ important findings? /m.test(r.body)),
              );
              const summary = reviews[verdictAt];
              // The operator's override: `review-accepted`, added after the newest summary review,
              // accepts the importants that round left with no thread, and the description of that
              // round or the push marker that replaced it. A later round lapses it, so its own
              // importants count; the label comes off so the operator sees that. Open threads
              // still count: each has its own resolve, and so does an unknown count, which no
              // summary review the operator could have read lists.
              let accepted = false;
              if (pr.labels.some((l) => l.name === ACCEPTED)) {
                const events = await github.paginate(github.rest.issues.listEvents, {
                  owner, repo, issue_number: number, per_page: 100,
                });
                accepted = acceptedSince(events, ACCEPTED, summary ? Date.parse(summary.submitted_at) : 0);
                if (!accepted) {
                  try {
                    await github.rest.issues.removeLabel({ owner, repo, issue_number: number, name: ACCEPTED });
                  } catch (e) {
                    if (e.status !== 404) throw e;
                  }
                }
              }
              if (
                (!accepted &&
                  ((review?.state === "success" && /\d+ important finding/.test(review.description ?? "")) ||
                    unthreadedImportants(summary?.body ?? "", threads.flatMap((t) => t.important ?? [])) > 0)) ||
                raisedAt > verdictAt ||
                threads.some((t) => !t.isResolved)
              ) {
                return "review-open";
              }
              const contexts = new Set(combined.statuses.map((s) => s.context));
              const runs = (
                await github.paginate(github.rest.checks.listForRef, {
                  owner, repo, ref: pr.head.sha, per_page: 100,
                })
              ).filter((c) => c.name !== context.job && !contexts.has(c.name));
              const bad = new Set(["failure", "timed_out", "cancelled", "action_required", "stale", "startup_failure"]);
              // Not combined.state: it is "pending" when a head has no status at all.
              if (
                runs.some((c) => bad.has(c.conclusion)) ||
                combined.statuses.some((s) => ["failure", "error"].includes(s.state))
              ) {
                return "ci-failing";
              }
              // A quick or area-restricted pass is no merge signal. It comes after the failure scan
              // so a partial round cannot hide a failing check.
              if (review?.state === "success" && review.description?.startsWith("partial review")) {
                return "ci-pending";
              }
              // The review preflight leaves a final "Not reviewed" pending status on a comment-only
              // push: nothing is running, so it does not count as pending. The push marker and a
              // retarget (claude-review-base-change.yml) leave the same prefix but the head still
              // awaits a review, so they count.
              const running = combined.statuses.some(
                (s) =>
                  s.state === "pending" &&
                  (!s.description?.startsWith("Not reviewed") ||
                    s.description.startsWith("Not reviewed: push since last review") ||
                    s.description.startsWith("Not reviewed: base branch changed")),
              );
              if (runs.some((c) => c.status !== "completed") || running) {
                return "ci-pending";
              }
              return "ready";
            }

            for (const [name, [color, description]] of Object.entries(LABELS)) {
              try {
                await github.rest.issues.createLabel({ owner, repo, name, color, description });
              } catch (e) {
                if (e.status !== 422) throw e;
              }
            }
            try {
              await github.rest.issues.createLabel({
                owner, repo, name: ACCEPTED, color: "c5def5",
                description: "The operator accepts the CI review's importants that have no thread; lapses at the next round",
              });
            } catch (e) {
              if (e.status !== 422) throw e;
            }

            for (const number of numbers) {
              const want = await statusOf(number);
              const { data: current } = await github.rest.issues.listLabelsOnIssue({
                owner, repo, issue_number: number,
              });
              const have = current.map((l) => l.name);
              // LABELS holds only the seven status names, so no other label (dependencies, GitHub's defaults) is ever removed here.
              for (const name of Object.keys(LABELS)) {
                if (name !== want && have.includes(name)) {
                  try {
                    await github.rest.issues.removeLabel({ owner, repo, issue_number: number, name });
                  } catch (e) {
                    if (e.status !== 404) throw e;
                  }
                }
              }
              if (want && !have.includes(want)) {
                await github.rest.issues.addLabels({ owner, repo, issue_number: number, labels: [want] });
              }
            }
