# Marks the head's `claude-review` commit status pending when a PR is retargeted, so a verdict
# earned against the old base cannot satisfy the gate. The next review (a push, or the owner's
# `@claude review`) replaces the status. A title or body edit does not match `changes.base`.
#
# pull_request_target so fork PRs are covered too. It is safe because nothing here checks out or
# runs the PR's code: it only calls the statuses API with values from the event payload.
name: Claude Review base change

on:
  pull_request_target:
    types: [edited]

permissions:
  contents: read
  statuses: write

jobs:
  mark-pending:
    if: github.event.changes.base
    # Same group as the review, so a retarget never races a review run that is posting its verdict.
    concurrency:
      group: claude-review-${{ github.event.pull_request.number }}
    runs-on: ubuntu-latest
    steps:
      - name: Mark the head not reviewed
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { owner, repo } = context.repo;
            await github.rest.repos.createCommitStatus({
              owner,
              repo,
              sha: context.payload.pull_request.head.sha,
              state: "pending",
              context: "claude-review",
              description: "Not reviewed: base branch changed; re-run",
              target_url: `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`,
            });
